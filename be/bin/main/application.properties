spring.application.name=roomincode

## Google SMTP Setting
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=roomincode@gmail.com
## should be moved to ENV File
#spring.mail.password=***MASKED***
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true

# smtp4dev SMTP Setting
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.auth.email.expiration-minutes=5
app.auth.email.subject-prefix=[RoomInCode]
app.auth.token-validity-minutes=5

# in case of doing extreme test
# spring.task.execution.pool.core-size=5

app.front.base-url=${FRONT_BASE_URL}

#jwt
jwt.secretkey=${JWT_SECRET_KEY}

# Server Configuration
server.port=8080

# Database Configuration (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# MyBatis Configuration
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.hamcheese.roomincode
mybatis.configuration.map-underscore-to-camel-case=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# OpenVidu
OPENVIDU_URL=${OPENVIDU_URL}
OPENVIDU_SECRET=${OPENVIDU_SECRET}

# File Save Path
# slash("/") in the end is MANDATORY
file.upload-dir=${FILE_UPLOAD_DIR}
# Mac/Linux: /Users/${username}/seoulmate/uploads/

# MultiPart File
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB