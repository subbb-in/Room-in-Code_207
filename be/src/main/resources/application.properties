#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true

# smtp4dev SMTP Setting
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.auth.email.expiration-minutes=5
app.auth.email.subject-prefix=[RoomInCode]
app.auth.token-validity-minutes=5

# in case of doing extreme test
# spring.task.execution.pool.core-size=5

judge0.url=${JUDGE_URL}
ai.server.url=${AI_SERVER_URL}
app.api.base-url=${BASE_URL}
app.front.base-url=${FRONT_BASE_URL}

#jwt
jwt.secretkey=${JWT_SECRET_KEY}

# Server Configuration
server.port=8080

# Database Configuration (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# MyBatis Configuration
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.hamcheese.roomincode
mybatis.configuration.map-underscore-to-camel-case=true

# Redis Configuration
spring.data.redis.host=redis-container
spring.data.redis.port=6379

# OpenVidu
OPENVIDU_URL=${OPENVIDU_URL}
OPENVIDU_SECRET=${OPENVIDU_SECRET}

# File Save Path
# slash("/") in the end is MANDATORY
file.upload-dir=${FILE_UPLOAD_DIR}
# Mac/Linux: /Users/${username}/seoulmate/uploads/

# MultiPart File
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Papago
papago.client-id=${PAPAGO_CLIENT_ID}
papago.client-secret=${PAPAGO_CLIENT_SECRET}
papago.url=${PAPAGO_URL}

# Social Login - GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github

# Social Login - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Proxy Server
server.forward-headers-strategy=native